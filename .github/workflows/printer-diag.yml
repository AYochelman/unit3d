# Read-only: what the printer agent last reported. Prints the status row, the
# latest jobs and the live status file as annotations. Changes nothing.
name: Printer diagnosis

on:
  workflow_dispatch:
    inputs:
      frame:
        description: "Also return the current camera still (base64, for layout mockups)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/printer-diag.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: public/shop.json
          sparse-checkout-cone-mode: false
      - name: Read
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SB=$(node -e "console.log(require('./public/shop.json').supabaseUrl.replace(/\/$/,''))")
          LIVE=$(node -e "console.log((require('./public/shop.json').liveUrl||'').replace(/\/$/,''))")
          H=(-H "apikey: $KEY")
          case "$KEY" in ey*) H+=(-H "Authorization: Bearer $KEY");; esac
          row=$(curl -s "${H[@]}" "$SB/rest/v1/printer_status?id=eq.live&select=*")
          echo "::notice title=status row::$(echo "$row" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s)[0]||{};for(const k of Object.keys(r))if(/key|token|secret|url/i.test(k))delete r[k];console.log(JSON.stringify(r).slice(0,900))})")"
          echo "::notice title=agent info::$(curl -s "${H[@]}" "$SB/rest/v1/shop_settings?key=eq.agent_info&select=value" | head -c 400)"
          echo "::notice title=access code set at::$(curl -s "${H[@]}" "$SB/rest/v1/shop_settings?key=eq.printer_access_code&select=at:value->>at" | head -c 200)"
          jobs=$(curl -s "${H[@]}" "$SB/rest/v1/printer_jobs?select=key,name,state,started_at,ended_at&order=started_at.desc&limit=4")
          echo "::notice title=last jobs::$(echo "$jobs" | head -c 900)"
          if [ -n "$LIVE" ]; then
            echo "::notice title=live status::$(curl -s -m 10 "$LIVE/live/status.json" | head -c 700)"
          fi
          # GitHub keeps only 10 notices per step, so the samples go last.
          for i in $(seq 1 4); do
            echo "::notice title=sample $i::$(curl -s "${H[@]}" "$SB/rest/v1/printer_status?id=eq.live&select=state,nozzle_temp,bed_temp,job_name,progress,updated_at" | head -c 300)"
            sleep 3
          done
      # The camera still, as base64 in chunks — the only way out of a run that
      # needs no artifact download. 10 notices per step, so it is its own step.
      - name: Camera still
        if: ${{ inputs.frame }}
        run: |
          SB=$(node -e "console.log(require('./public/shop.json').supabaseUrl.replace(/\/$/,''))")
          curl -s "$SB/storage/v1/object/public/printer/live.jpg" -o cam.jpg
          pip install -q pillow
          python3 -c "
          from PIL import Image
          import os
          im = Image.open('cam.jpg'); print('::notice title=frame size::%dx%d' % im.size)
          im = im.convert('RGB'); im.thumbnail((960, 960))
          for q in (80, 68, 56, 45, 35):
              im.save('small.jpg', quality=q)
              if os.path.getsize('small.jpg') < 46000: break
          "
          base64 -w0 small.jpg | fold -w 7000 | head -n 9 | nl -v1 | while read -r n chunk; do echo "::notice title=frame $n::$chunk"; done
