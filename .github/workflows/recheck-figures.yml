# Re-reads every model's weight and print time from MakerWorld.
#
# Those two numbers ARE the price — the whole cost model is
# suggestPrice(grams, hours) — so a wrong one is a wrong price on the shelf
# every day, and silently. Designers also re-slice their models after
# publishing, which moves the figure under us. Monthly, and on demand.
name: Recheck weights and times

on:
  schedule:
    - cron: "40 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: recheck-figures
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Recheck
        run: npm run recheck:figures
      # The recheck can bring in new photographs (a model's whole gallery, not
      # just its cover). They arrive as URLs on the designer's CDN; store our
      # own copies, or the shop hotlinks pictures it does not control.
      - name: Fetch the new photos
        run: npm run fetch:images
      - name: Type check
        run: npx tsc --noEmit
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in lib/imported.generated.ts lib/localImages.generated.ts public/img/catalog; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to fix"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Correct the figures, and store the photos that came with them"
          # Another job (or a person) can land a commit while this one runs;
          # rebase onto it rather than losing the work to a rejected push.
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
