# Adds to the shop whatever the owner saved on MakerWorld, and queues what he
# liked.
#
# He curates from the Bambu Lab app on his phone: a model he wants goes into one
# of his collections. This reads those collections every night, appends the ones
# the catalogue does not have, fetches their photos, commits, and asks the site
# to rebuild — so a model saved in the evening is on the shop in the morning
# without anyone opening a laptop.
#
# It only ever adds. Existing rows are never rewritten, and a weapon or a model
# under a non-commercial licence is imported but held out of the shop, exactly
# as in a manual import. The run summary lists what landed and under which
# licence.
name: Sync MakerWorld collections

on:
  schedule:
    # 08:00 Israel time, which is 05:00 UTC in summer and 06:00 in winter.
    # Cron only understands UTC, so both are listed rather than being right for
    # half the year; the second run of the day finds nothing new and says so.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-collections
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The collection pages render server-side but only in a real browser;
      # every documented collection API answers `{}`.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Optional. Without it the job reads only the public collections, and
      # Cloudflare turns a server away more often than not; with it the session
      # is trusted and the private collections are readable too.
      - name: Read the collections
        env:
          MAKERWORLD_COOKIE: ${{ secrets.MAKERWORLD_COOKIE }}
        run: npm run sync:collections

      # A like is not a decision. What he liked and does not already own goes
      # to /admin → "מודלים לאישור" so he picks per model, which is the rule
      # for everything the shop did not choose itself.
      - name: Queue what he liked
        run: |
          if [ -s data/liked-models.json ]; then
            IDS=$(node -e "const j=require('./data/liked-models.json');process.stdout.write((j.fresh||[]).join(' '))")
            if [ -n "$IDS" ]; then npm run add:candidates -- $IDS; else echo "no new likes"; fi
          else
            echo "no likes file"
          fi
        continue-on-error: true

      - name: Fetch the new photos
        run: npm run fetch:images
        continue-on-error: true

      # Type check before committing: a bad row must not reach the site.
      - name: Type check
        run: npx tsc --noEmit

      - name: Commit what is new
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One path a step did not produce must not throw away the rest.
          for p in lib/imported.generated.ts lib/localImages.generated.ts \
                   lib/candidates.generated.ts data/makerworld-raw.json \
                   data/pending-models.json data/liked-models.json public/img/catalog; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Add what was saved on MakerWorld, and queue what was liked"
          # Another job (or a person) can land a commit while this one runs;
          # rebase onto it rather than losing the work to a rejected push.
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            git pull --rebase origin main || exit 1
            sleep $((i * 3))
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not start another workflow, so the
      # deploy has to be asked for by name or the commit would sit unpublished.
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
