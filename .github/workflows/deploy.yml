# Publishes the site to GitHub Pages on every push to main.
#
# One-time setup (only if Pages is not already on): Settings → Pages →
# Source = "GitHub Actions". The configure-pages step below also tries to turn
# it on by itself.
name: Deploy site

on:
  push:
    # `main` is the live site. `preview` is the staging copy that lands at
    # /preview on the same domain — pushing to it never touches the live pages.
    branches: [main, preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once — but only against runs on the SAME branch.
#
# Two lessons, both learned the hard way:
#   * cancel-in-progress: true let a push to `preview` kill a live deploy that
#     was already running, and the live site silently kept the old build.
#   * even with it off, a queued run is superseded by a newer one in the same
#     group — so a `preview` push could discard a `main` deploy that had not
#     started yet. `preview` runs do not deploy at all, so they have no business
#     sharing a queue with the ones that do.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ALWAYS the live branch, whichever branch triggered the run. A push to
      # `preview` must never be able to build preview code into the root of
      # unit-3d.com — the deploy below is gated too, and this is the second
      # lock on the same door.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same three gates that run locally. A red one stops the deploy, so a
      # broken build can never reach the live site.
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

      # The catalogue photos live in the repo (public/img/catalog). This picks
      # up anything a new model added but nobody has fetched yet, so the built
      # site never has to hotlink a designer's CDN. It is a no-op when the
      # folder is already complete, and a failure here is not fatal — an image
      # with no local copy falls back to its original URL.
      - name: Fetch catalogue images
        run: npm run fetch:images
        continue-on-error: true

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
          static_site_generator: next

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # Pages serves the repo at /<repo>/ unless a custom domain is set.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # ── The staging copy ──────────────────────────────────────────────
      #
      # GitHub Pages publishes ONE site per repository, so the preview cannot
      # have a deployment of its own. Instead it is built from the `preview`
      # branch into ./out/preview and rides along: unit-3d.com stays the live
      # site and unit-3d.com/preview/ is the same shop with the experiment on.
      #
      # continue-on-error is the point of the whole arrangement — a preview
      # that does not compile must never be able to stop the live site from
      # deploying. If this step fails, the upload below still carries a
      # complete, correct production build.
      - name: Check out the preview branch
        id: preview_src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: preview
          path: .preview-src

      - name: Build the preview
        id: preview_build
        if: steps.preview_src.outcome == 'success'
        continue-on-error: true
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /preview
        run: |
          cd .preview-src
          npm ci
          npm run build
          mkdir -p ../out/preview
          cp -r out/. ../out/preview/

      - name: Say what the preview did
        run: |
          if [ "${{ steps.preview_build.outcome }}" = "success" ]; then
            echo "preview built -> /preview/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "preview NOT built (${{ steps.preview_build.outcome }}) - the live site deployed anyway" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This run was triggered from \`${{ github.ref_name }}\`, so it BUILT but did not publish." >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Pages only accepts a deployment from the default branch." >> "$GITHUB_STEP_SUMMARY"
            echo "Publish it with: Actions -> Deploy site -> Run workflow (on main)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    # GitHub Pages accepts a deployment only from the default branch: a run on
    # `preview` had its deploy job rejected in one second, with no log, every
    # time. Skipping it deliberately is honest — a green "built, not published"
    # beats a red X that looks like the build broke.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
