# Publishes the site to GitHub Pages on every push to main.
#
# One-time setup (only if Pages is not already on): Settings → Pages →
# Source = "GitHub Actions". The configure-pages step below also tries to turn
# it on by itself.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same three gates that run locally. A red one stops the deploy, so a
      # broken build can never reach the live site.
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

      # The catalogue photos live in the repo (public/img/catalog). This picks
      # up anything a new model added but nobody has fetched yet, so the built
      # site never has to hotlink a designer's CDN. It is a no-op when the
      # folder is already complete, and a failure here is not fatal — an image
      # with no local copy falls back to its original URL.
      - name: Fetch catalogue images
        run: npm run fetch:images
        continue-on-error: true

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
          static_site_generator: next

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # Pages serves the repo at /<repo>/ unless a custom domain is set.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
