# Fills, and empties, the approval queue.
#
# Two halves of one loop:
#   · a weekly sweep of what is trending on MakerWorld, into /admin →
#     "מודלים לאישור" — nothing reaches the shop from it on its own;
#   · applying the owner's answers the moment he saves them from that tab,
#     which writes public/model-decisions.json to this repository.
#
# The second half is what makes the first safe: a sweep can be as greedy as it
# likes, because a person still decides model by model.
name: Model candidates

on:
  push:
    branches: [main]
    paths:
      - "public/model-decisions.json"
  schedule:
    # Sunday 04:20 UTC — a fresh queue waiting at the start of the week.
    - cron: "20 4 * * 0"
  workflow_dispatch:
    inputs:
      collect:
        description: "לסרוק מודלים חדשים"
        type: boolean
        default: true
      add:
        description: "קישורים או מספרי מודל להוספה לתור (מופרדים ברווח)"
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: candidates
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      # Answers first: a model approved this morning must not be offered again
      # by the sweep that runs a second later.
      - name: Apply the owner's decisions
        run: npm run apply:approvals

      # Anything the owner pasted. The runner can reach the MakerWorld API, so
      # this is the path that works even when the machine asking cannot.
      - name: Queue what the owner sent
        if: inputs.add != ''
        # Through the environment, not interpolated into the command line —
        # the value is typed by a person and must not be able to become shell.
        env:
          ADD: ${{ inputs.add }}
        run: npm run add:candidates -- $ADD

      - name: Collect what is trending
        if: github.event_name != 'workflow_dispatch' || inputs.collect
        run: npm run collect:candidates

      - name: Fetch any new photos
        run: npm run fetch:images
        continue-on-error: true

      # The designers' own clips, for the hover preview on the shop cards.
      # ffmpeg is NOT on the runner image any more, so install it first; the
      # script caps how many it transcodes per run.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
        continue-on-error: true

      - name: Fetch any new clips
        run: npm run fetch:videos
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # One path that a step did not produce must not throw away the work
          # of every step that did — `git add` treats a missing pathspec as
          # fatal, and that lost a whole queued model once.
          for p in lib/candidates.generated.ts lib/imported.generated.ts \
                   lib/localImages.generated.ts lib/localVideos.generated.ts \
                   data/model-videos.json data/makerworld-raw.json \
                   data/rejected-models.json public/model-decisions.json \
                   public/img/catalog public/img/catalog-video; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh the approval queue and apply the answers"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
