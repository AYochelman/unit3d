# Every picture, GIF and clip the designer published, for every model, in
# high quality.
#
# 1. backfill:images --all  re-reads each model's gallery from MakerWorld (all of
#    it, GIFs included — it used to stop at 8 and skip GIFs). Only grows a
#    gallery, never shrinks one.
# 2. fetch:images --all     re-downloads every photo at up to 1400px.
# 3. fetch:videos --all     re-checks every model for a clip and re-encodes at 720p.
#
# Runs when this file changes (so the first run happens on push), monthly,
# and on demand. New models between runs are covered by the daily jobs.
name: Refresh all model media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-refresh.yml"
  schedule:
    - cron: "23 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: media-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The MakerWorld API refuses node's own connection and answers a browser
      # (CLAUDE.md, "ייבוא ממייקרוורלד"); getJson falls back to one.
      - name: Install Chromium and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Every picture of every model
        run: |
          npm run backfill:images -- --all 2>&1 | tee /tmp/out.txt
          tail -n 6 /tmp/out.txt | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::notice title=Every picture of every model::$l"; done
        continue-on-error: true

      - name: Download them in high quality
        run: |
          npm run fetch:images -- --all 2>&1 | tee /tmp/out.txt
          tail -n 6 /tmp/out.txt | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::notice title=Download them in high quality::$l"; done
        continue-on-error: true

      - name: Clips, 720p
        env:
          VIDEO_LIMIT: "300"
        run: |
          npm run fetch:videos -- --all 2>&1 | tee /tmp/out.txt
          tail -n 4 /tmp/out.txt | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::notice title=Clips::$l"; done
        continue-on-error: true

      - name: What the shop holds now
        run: |
          npm run audit:media 2>&1 | tee /tmp/out.txt
          tail -n 6 /tmp/out.txt | sed 's/\x1b\[[0-9;]*m//g' | while IFS= read -r l; do [ -n "$l" ] && echo "::notice title=What the shop holds now::$l"; done
        continue-on-error: true

      # A bad row must not reach the site.
      - name: Type check
        run: npx tsc --noEmit

      # In batches: one commit of ~4,000 re-encoded photos is several hundred MB,
      # and GitHub hangs up on a push that size ("unexpected disconnect").
      # Photos and clips go first, a few hundred at a time; the manifests that
      # point at them go last, so the site never references a missing file.
      # Batch pushes made with GITHUB_TOKEN start no deploy of their own.
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          push() {
            for i in 1 2 3 4 5; do
              if git push -q 2>/tmp/push.txt; then return 0; fi
              echo "::warning title=Push::$(tail -n 2 /tmp/push.txt | tr '\n' ' ')"
              git pull -q --rebase origin main || return 1
              sleep $((i * 5))
            done
            return 1
          }
          git add -A public/img/catalog public/img/catalog-video
          files=$(git diff --cached --name-only | wc -l)
          git reset -q
          n=0
          git status --porcelain -uall -- public/img/catalog public/img/catalog-video | awk '{print $NF}' | split -l 300 - /tmp/batch.
          for b in /tmp/batch.*; do
            [ -e "$b" ] || continue
            xargs -a "$b" git add -A --
            git diff --cached --quiet && continue
            n=$((n + 1))
            git commit -q -m "Model media in high quality (part $n)"
            push || { echo "::error title=Push::part $n never landed"; exit 1; }
          done
          for p in lib/imported.generated.ts lib/localImages.generated.ts lib/localVideos.generated.ts data/model-videos.json; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -q -m "Every picture, GIF and clip of every model, in high quality"
            push || { echo "::error title=Push::manifests never landed"; exit 1; }
            n=$((n + 1))
          fi
          echo "::notice title=Commit::$files media files in $n pushes"
          if [ "$n" -gt 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      # A push made with GITHUB_TOKEN does not start another workflow.
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
