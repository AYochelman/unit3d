# Read-only: which models on sale no longer exist on MakerWorld.
# Reports as annotations; changes nothing. Monthly, and on demand.
name: Check model sources

on:
  schedule:
    - cron: "17 4 15 * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Only these model numbers (space separated); empty = every live model"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The MakerWorld API refuses node's own connection and answers a browser
      # (CLAUDE.md, "ייבוא ממייקרוורלד"); getJson falls back to one.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check
        env:
          IDS: ${{ inputs.ids }}
        run: npm run -s check:sources -- $IDS
